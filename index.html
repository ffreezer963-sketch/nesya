const { useState, useEffect, useMemo, useCallback } = React;

/* ====== ROUTER ====== */
function useRouter() {
  const [route, setRoute] = useState(() => window.location.hash.slice(1) || '/');
  useEffect(() => {
    const h = () => { setRoute(window.location.hash.slice(1) || '/'); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', h);
    return () => window.removeEventListener('hashchange', h);
  }, []);
  const navigate = useCallback((r) => { window.location.hash = r; }, []);
  return { route, navigate };
}

}

/* ====== UI COMPONENTS ====== */
function Button({ children, onClick, variant = 'primary', className = '', size = 'md', disabled, ...props }) {
  const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-5 py-2.5 text-sm', lg: 'px-6 py-3 text-bottome' };
  const variants = {
    primary: 'btn-primary',
    outline: 'border-2 border-purple-400 text-purple-600 hover:bg-purple-50 bg-white',
    ghost: 'text-purple-600 hover:bg-purple-50 bg-transparent border-none cursor-pointer',
    gold: 'bg-yellow-500 text-white hover:bg-yellow-600 border-none cursor-pointer',
    danger: 'bg-red-500 text-white hover:bg-red-600 border-none cursor-pointer',
    success: 'bg-green-500 text-white hover:bg-green-600 border-none cursor-pointer'
  };
  return (
    <button onClick={onClick} disabled={disabled}
      className={`${sizes[size]} ${variants[variant]} rounded-xl font-semibold transition-all ${className}`}
      {...props}>{children}</button>
  );
}

function Card({ children, className = '', onClick }) {
  return <div onClick={onClick} className={`bg-white rounded-2xl shadow-sm border border-gray-100 p-4 transition-all ${className}`}>{children}</div>;
}

function Badge({ children, color = 'purple' }) {
  const colors = {
    purple: 'bg-purple-100 text-purple-700', pink: 'bg-pink-100 text-pink-700',
    green: 'bg-green-100 text-green-700', yellow: 'bg-yellow-100 text-yellow-700',
    red: 'bg-red-100 text-red-700', blue: 'bg-blue-100 text-blue-700', gray: 'bg-gray-100 text-gray-600'
  };
  return <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${colors[color]}`}>{children}</span>;
}

function Input({ label, ...props }) {
  return (
    <div className="mb-3">
      {label && <label className="block text-sm font-medium text-gray-600 mb-1">{label}</label>}
      <input className="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm transition-all" {...props} />
    </div>
  );
}

function Select({ label, children, ...props }) {
  return (
    <div className="mb-3">
      {label && <label className="block text-sm font-medium text-gray-600 mb-1">{label}</label>}
      <select className="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm bg-white" {...props}>{children}</select>
    </div>
  );
}

function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 fade-in" onClick={onClose}>
      <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full sm:max-w-md max-h-[85vh] overflow-y-auto p-5" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-bold text-gray-800">{title}</h3>
          <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-full text-gray-500 text-xl">&times;</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function StarRating({ rating, size = 14 }) {
  return (
    <div className="flex items-center gap-0.5">
      {[1, 2, 3, 4, 5].map(i => (
        <svg key={i} width={size} height={size} viewBox="0 0 24 24" fill={i <= Math.round(rating) ? '#D4AF37' : '#E5E7EB'}>
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
        </svg>
      ))}
    </div>
  );
}

function Avatar({ name, size = 44 }) {
  const initials = name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const colors = ['#6B21A8', '#9333EA', '#EC4899', '#D4AF37', '#0891B2', '#059669'];
  const color = colors[name.charCodeAt(0) % colors.length];
  return (
    <div style={{ width: size, height: size, background: color, fontSize: size * 0.4 }}
      className="rounded-full flex items-center justify-center text-white font-bold flex-shrink-0">{initials}</div>
  );
}

function EmptyState({ icon, title, sub }) {

      <p className="text-gray-500 font-medium">{title}</p>

}

/* ====== NAVBAR ====== */
function Navbar({ route, navigate, currentUser, setCurrentUser }) {
  const [menuOpen, setMenuOpen] = useState(false);

    { label: 'Accueil', path: '/' },
    { label: 'Services', path: '/services' },
    { label: 'Mes reservations', path: '/bookings' },
    { label: 'Prestataires', path: '/providers' }
  ];
  if (currentUser && currentUser.role === 'provider') navItems.push({ label: 'Mon espace', path: '/provider-dashboard' });
  if (currentUser && currentUser.role === 'admin') navItems.push({ label: 'Admin', path: '/admin' });

  return (
    <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100">
      <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">

            <p className="text-[10px] text-gray-400 leading-tight">La beaute, simplement connectee</p>
          </div>
        </div>
        <nav className="hidden md:flex items-center gap-6">
          {navItems.map(item => (
            <button key={item.path} onClick={() => navigate(item.path)}
              className={`text-sm font-medium transition ${route === item.path ? 'text-purple-600 font-semibold' : 'text-gray-600 hover:text-purple-600'}`}>
              {item.label}
            </button>
          ))}
          {currentUser ? (
            <div className="flex items-center gap-3">
              <button onClick={() => navigate('/profile')} className="flex items-center gap-2">
                <Avatar name={currentUser.name} size={32} />
                <span className="text-sm font-medium text-gray-700">{currentUser.name.split(' ')[0]}</span>
              </button>
              <Button size="sm" variant="ghost" onClick={() => { setCurrentUser(null); navigate('/'); }}>Deconnexion</Button>
            </div>
          ) : (
            <div className="flex items-center gap-2">
              <Button size="sm" variant="ghost" onClick={() => navigate('/login')}>Connexion</Button>
              <Button size="sm" onClick={() => navigate('/register')}>Inscription</Button>
            </div>
          )}

        <button className="md:hidden p-2" onClick={() => setMenuOpen(!menuOpen)}>
          <span className="text-2xl">{menuOpen ? '\u00D7' : '\u2630'}</span>
        </button>
      </div>

        <div className="md:hidden bg-white border-t border-gray-100 p-4 space-y-2">
          {navItems.map(item => (
            <button key={item.path} onClick={() => { navigate(item.path); setMenuOpen(false); }}

/* ====== SERVICES ====== */
function Services({ navigate, route }) {
  const params = useMemo(() => {
    const q = route.split('?')[1] || '';
    const url = new URLSearchParams(q);
    return { q: url.get('q') || '', cat: url.get('cat') || '' };
  }, [route]);
  const [search, setSearch] = useState(params.q);
  const [cat, setCat] = useState(params.cat);
  const [sort, setSort] = useState('rating');
  useEffect(() => { setSearch(params.q); setCat(params.cat); }, [route]);

  const filtered = useMemo(() => {
    let r = PROVIDERS.filter(p => {
      const ms = !search || p.name.toLowerCase().includes(search.toLowerCase()) || p.services.some(s => s.toLowerCase().includes(search.toLowerCase()));
      const mc = !cat || p.category === cat;
      return ms && mc;
    });
    if (sort === 'rating') r = [...r].sort((a, b) => b.rating - a.rating);
    if (sort === 'price-asc') r = [...r].sort((a, b) => a.price - b.price);
    if (sort === 'price-desc') r = [...r].sort((a, b) => b.price - a.price);
    return r;
  }, [search, cat, sort]);

  return (
    <div className="max-w-6xl mx-auto px-4 py-6 fade-in">
      <h1 className="text-2xl font-bold text-gray-800 mb-4">Services de beaute</h1>
      <div className="flex flex-col sm:flex-row gap-3 mb-6">
        <input type="text" placeholder="Rechercher..." value={search} onChange={e => setSearch(e.target.value)}
          className="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm" />
        <select value={cat} onChange={e => setCat(e.target.value)} className="px-4 py-2.5 border border-gray-200 rounded-xl text-sm bg-white">
          <option value="">Toutes categories</option>
          {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <select value={sort} onChange={e => setSort(e.target.value)} className="px-4 py-2.5 border border-gray-200 rounded-xl text-sm bg-white">
          <option value="rating">Mieux notes</option>
          <option value="price-asc">Prix croissant</option>
          <option value="price-desc">Prix decroissant</option>
        </select>
      </div>
      <p className="text-sm text-gray-500 mb-4">{filtered.length} prestataire(s) trouve(s)</p>
      {filtered.length === 0 ? (
        <EmptyState icon="🔍" title="Aucun prestataire trouve" sub="Essayez d autres criteres" />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map(p => (
            <Card key={p.id} onClick={() => navigate('/provider/' + p.id)} className="cursor-pointer">
              <div className="flex items-start gap-3">
                <Avatar name={p.name} size={52} />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1">
                    <h3 className="font-semibold text-gray-800 truncate">{p.name}</h3>
                    {p.verified && <span className="text-purple-600 text-sm">✓</span>}
                  </div>
                  <div className="flex items-center gap-1 mt-1">
                    <StarRating rating={p.rating} size={12} />
                    <span className="text-xs text-gray-500">{p.rating} ({p.reviews})</span>
                  </div>
                  <p className="text-xs text-gray-400 mt-1">{p.location}</p>
                  <div className="flex flex-wrap gap-1 mt-2">
                    {p.services.slice(0, 2).map(s => <Badge key={s} color="purple">{s}</Badge>)}
                    {p.services.length > 2 && <Badge color="gray">+{p.services.length - 2}</Badge>}
                  </div>
                  <div className="flex items-center justify-between mt-3 pt-3 border-t border-gray-50">
                    <span className="text-lg font-bold gradient-text">{p.price.toLocaleString()} F</span>
                    <Button size="sm" onClick={e => { e.stopPropagation(); navigate('/provider/' + p.id); }}>Voir</Button>
                  </div>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ====== PAYMENT ====== */
function Payment({ navigate, route }) {
  const bookingId = route.split('/')[2];
  const booking = MOCK_BOOKINGS.find(b => b.id === bookingId);
  const [method, setMethod] = useState('');
  const [promoCode, setPromoCode] = useState('');
  const [promoApplied, setPromoApplied] = useState(null);
  const [promoError, setPromoError] = useState('');
  const [step, setStep] = useState('select');
  const [processing, setProcessing] = useState(false);

  if (!booking) {
    return <div className="max-w-4xl mx-auto px-4 py-20 text-center">
      <p className="text-gray-500">Reservation introuvable</p>
      <Button onClick={() => navigate('/bookings')} className="mt-4">Mes reservations</Button>
    </div>;
  }

  let total = booking.price;
  if (promoApplied) {
    if (promoApplied.type === 'percent') total -= total * promoApplied.value / 100;
    else total -= promoApplied.value;
    total = Math.max(0, total);
  }

  const applyPromo = () => {
    const promo = PROMO_CODES.find(p => p.code === promoCode.toUpperCase() && p.active);
    if (!promo) { setPromoError('Code invalide ou expire'); setPromoApplied(null); return; }
    setPromoApplied(promo); setPromoError('');
  };

  const handlePay = () => {
    if (!method) return;
    setProcessing(true);
    setTimeout(() => { setProcessing(false); setStep('success'); }, 2000);
  };

  if (step === 'success') {
    return <div className="max-w-md mx-auto px-4 py-12 fade-in">
      <Card className="text-center">
        <div className="text-5xl mb-3">✅</div>
        <h2 className="text-xl font-bold text-gray-800">Paiement reussi !</h2>
        <p className="text-sm text-gray-500 mt-2">Paiement de {Math.round(total).toLocaleString()} F via {PAYMENT_METHODS.find(m => m.id === method).name}</p>
        <p className="text-xs text-gray-400 mt-1">Reservation {booking.id}</p>
        <div className="mt-5 space-y-2">
          <Button onClick={() => navigate('/bookings')} className="w-full">Mes reservations</Button>
          <Button variant="outline" onClick={() => navigate('/')} className="w-full">Accueil</Button>
        </div>
      </Card>
    </div>;
  }

  return (
    <div className="max-w-md mx-auto px-4 py-6 fade-in">
      <button onClick={() => navigate('/bookings')} className="text-sm text-gray-500 mb-4">← Retour</button>
      <h1 className="text-2xl font-bold text-gray-800 mb-4">Paiement</h1>

      <Card className="mb-4">
        <h3 className="font-semibold text-gray-800 mb-3">{booking.service}</h3>
        <div className="space-y-2 text-sm">
          <div className="flex justify-between"><span className="text-gray-500">Prestataire</span><span>{booking.provider}</span></div>
          <div className="flex justify-between"><span className="text-gray-500">Date</span><span>{booking.date} a {booking.time}</span></div>
          <div className="flex justify-between pt-2 border-t"><span className="text-gray-500">Montant</span><span className="font-bold">{booking.price.toLocaleString()} F</span></div>
        </div>
      </Card>

      <Card className="mb-4">
        <h3 className="font-semibold text-gray-800 mb-3">Code promo</h3>
        <div className="flex gap-2">
          <input type="text" placeholder="Ex: NESYA10" value={promoCode}
            onChange={e => setPromoCode(e.target.value.toUpperCase())}
            className="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm uppercase" />
          <Button variant="outline" onClick={applyPromo}>Appliquer</Button>
        </div>
        {promoError && <p className="text-red-500 text-xs mt-2">{promoError}</p>}
        {promoApplied && (
          <div className="mt-2 p-2 bg-green-50 rounded-lg flex items-center justify-between">
            <span className="text-sm text-green-700">{promoApplied.code} - {promoApplied.description}</span>
            <Badge color="green">-{promoApplied.type === 'percent' ? promoApplied.value + '%' : promoApplied.value.toLocaleString() + ' F'}</Badge>
          </div>
        )}
      </Card>

      <Card className="mb-4">
        <h3 className="font-semibold text-gray-800 mb-3">Moyen de paiement</h3>
        <div className="space-y-2">
          {PAYMENT_METHODS.map(m => (
            <button key={m.id} onClick={() => setMethod(m.id)}
              className={`w-full p-3 rounded-xl border-2 flex items-center gap-3 transition-all ${method === m.id ? 'border-purple-500 bg-purple-50' : 'border-gray-100'}`}>
              <div style={{ background: m.color, width: 40, height: 40 }} className="rounded-full flex items-center justify-center text-white font-bold">{m.icon}</div>
              <span className="text-sm font-medium text-gray-700">{m.name}</span>
              {method === m.id && <span className="ml-auto text-purple-600">✓</span>}
            </button>
          ))}
        </div>
      </Card>

      <Card className="mb-4">
        <div className="space-y-2 text-sm">
          <div className="flex justify-between"><span className="text-gray-500">Sous-total</span><span>{booking.price.toLocaleString()} F</span></div>
          {promoApplied && <div className="flex justify-between text-green-600"><span>Reduction</span><span>-{(booking.price - total).toLocaleString()} F</span></div>}
          <div className="flex justify-between pt-2 border-t font-bold text-lg"><span>Total</span><span className="gradient-text">{Math.round(total).toLocaleString()} F</span></div>
        </div>
      </Card>

      <Button onClick={handlePay} disabled={!method || processing} size="lg" className="w-full">
        {processing ? 'Traitement...' : 'Payer ' + Math.round(total).toLocaleString() + ' F'}
      </Button>
      <p className="text-xs text-gray-400 text-center mt-3">Mode test - Aucun paiement reel ne sera effectue</p>
    </div>
  );
}

/* ====== APP ====== */
function App() {
  const { route, navigate } = useRouter();
  const [currentUser, setCurrentUser] = useState(null);

  const renderPage = () => {
    const bottome = route.split('?')[0];
    if (bottome === '/' || bottome === '') return <Home navigate={navigate} />;
    if (bottome.startsWith('/services')) return <Services navigate={navigate} route={route} />;
    if (bottome.startsWith('/provider/')) return <ProviderDetail navigate={navigate} route={route} currentUser={currentUser} />;
    if (bottome.startsWith('/providers')) return <Providers navigate={navigate} />;
    if (bottome.startsWith('/bookings')) return <Bookings navigate={navigate} currentUser={currentUser} />;
    if (bottome.startsWith('/payment/')) return <Payment navigate={navigate} route={route} />;
    if (bottome.startsWith('/login')) return <Login navigate={navigate} setCurrentUser={setCurrentUser} />;
    if (bottome.startsWith('/register')) return <Register navigate={navigate} setCurrentUser={setCurrentUser} />;
    if (bottome.startsWith('/profile')) return <Profile navigate={navigate} currentUser={currentUser} setCurrentUser={setCurrentUser} />;
    if (bottome.startsWith('/provider-dashboard')) return <ProviderDashboard navigate={navigate} currentUser={currentUser} />;
    if (bottome.startsWith('/admin')) return <Admin navigate={navigate} currentUser={currentUser} />;
    if (bottome.startsWith('/about')) return <About />;
    if (bottome.startsWith('/help')) return <Help />;
    return (
      <div className="max-w-md mx-auto px-4 py-20 text-center">
        <div className="text-5xl mb-3 opacity-30">🔍</div>
        <h1 className="text-xl font-bold text-gray-800">Page introuvable</h1>
        <Button onClick={() => navigate('/')} className="mt-4">Accueil</Button>
      </div>
    );
  };

  return (
    <div className="min-h-screen bg-gray-50 flex flex-col">
      <Navbar route={route.split('?')[0]} navigate={navigate} currentUser={currentUser} setCurrentUser={setCurrentUser} />
      <main className="flex-1">{renderPage()}</main>
      <Footer navigate={navigate} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
